<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация на Полигоне</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: #333; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 300px; }
        h2 { text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #555; background: #444; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
        .error { color: #ff6b6b; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Регистрация</h2>
    
    <!-- Форма отправляет данные методом POST на адрес /register -->
    <form action="/register" method="post">
        <input type="text" name="username" placeholder="Придумайте логин" required>
        <input type="password" name="password" placeholder="Придумайте пароль" required>
        <button type="submit">Зарегистрироваться</button>
    </form>
    <div class="link" style="text-align: center; margin-top: 15px; font-size: 14px;">
    Уже есть аккаунт? <a href="/login" style="color: #007bff; text-decoration: none;">Войти</a>
    </div>

</div>

</body>
</html>
